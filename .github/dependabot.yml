version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Dependabot cannot pick a release label, and the release-label check is
    # required. Without this every dependency PR would sit blocked. `norelease`
    # batches the bumps into whatever release comes next rather than cutting one
    # per dependency; label a PR `release:patch` by hand to ship it immediately.
    labels: ["dependencies", "norelease"]
    groups:
      # One PR for routine patch/minor bumps keeps the queue readable; majors
      # still arrive individually because they need real review.
      python-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Dependabot cannot pick a release label, and the release-label check is
    # required. Without this every dependency PR would sit blocked. `norelease`
    # batches the bumps into whatever release comes next rather than cutting one
    # per dependency; label a PR `release:patch` by hand to ship it immediately.
    labels: ["dependencies", "norelease"]
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # Dependabot cannot pick a release label, and the release-label check is
    # required. Without this every dependency PR would sit blocked. `norelease`
    # batches the bumps into whatever release comes next rather than cutting one
    # per dependency; label a PR `release:patch` by hand to ship it immediately.
    labels: ["dependencies", "norelease"]

  # Every directory that holds a Dockerfile: the backend's at the root and the
  # frontend's DockerfileFrontend. Dependabot does not search subdirectories.
  - package-ecosystem: "docker"
    directories: ["/", "/frontend"]
    schedule:
      interval: "monthly"
    # Dependabot cannot pick a release label, and the release-label check is
    # required. Without this every dependency PR would sit blocked. `norelease`
    # batches the bumps into whatever release comes next rather than cutting one
    # per dependency; label a PR `release:patch` by hand to ship it immediately.
    labels: ["dependencies", "norelease"]
