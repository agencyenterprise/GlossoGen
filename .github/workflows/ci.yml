name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: make install-server

      # check-server, not lint-server: the latter runs black and isort in write
      # mode, so in CI it fixes the checkout and exits 0.
      - name: Check server (black, isort, ruff, pyright, vulture, custom linters)
        run: make check-server

  test:
    runs-on: ubuntu-latest
    permissions:
      # GitHub downgrades both to read-only for pull_request runs from forks,
      # so a fork's PR cannot use them. Trusted PRs get their comment posted
      # here; fork PRs fall through to post-coverage-comment.yml.
      pull-requests: write
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: make install-server

      # No network and no provider keys: agents run on a scripted model and
      # judges on a stub, so a contributor without credentials gets the same
      # result CI does.
      - name: Run tests with coverage
        run: make test-cov

      # On a PR: comment with the total, the delta against main, and how much
      # of the diff is covered. On main: refresh the stored baseline the next
      # PR compares against, on the python-coverage-comment-action-data branch.
      - name: Coverage comment
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@v4.3
        with:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Store the comment for a fork PR to post
        uses: actions/upload-artifact@v7
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt

  # A separate job because the notebooks need jupyter, pandas and matplotlib, which
  # nothing else here does. They generate their own run with scripted agents, so
  # this reaches no network and needs no provider key, the same as the test suite.
  run-notebooks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: make install-notebooks

      # Executes every cell top to bottom and fails on the first one that raises,
      # so a notebook cannot go stale while still looking finished.
      - name: Run the notebooks
        run: make test-notebooks

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: make install-frontend

      - name: Check frontend (prettier, eslint, stylelint, tsc)
        run: make check-frontend

  check-api-types:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          make install-server
          make install-frontend

      - name: Regenerate API types and check for drift
        run: |
          make gen-api-types
          # Both files are tracked and both are regenerated, so both must be guarded.
          git diff --exit-code frontend/openapi.json frontend/src/types/api.gen.ts || \
            (echo "API schema/types are out of date. Run 'make gen-api-types' and commit the result." && exit 1)
