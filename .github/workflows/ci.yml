name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: make install-server

      # check-server, not lint-server: the latter runs black and isort in write
      # mode, so in CI it fixes the checkout and exits 0.
      - name: Check server (black, isort, ruff, pyright, vulture, custom linters)
        run: make check-server

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: make install-frontend

      - name: Check frontend (prettier, eslint, stylelint, tsc)
        run: make check-frontend

  check-api-types:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          make install-server
          make install-frontend

      - name: Regenerate API types and check for drift
        run: |
          make gen-api-types
          # Both files are tracked and both are regenerated, so both must be guarded.
          git diff --exit-code frontend/openapi.json frontend/src/types/api.gen.ts || \
            (echo "API schema/types are out of date. Run 'make gen-api-types' and commit the result." && exit 1)
