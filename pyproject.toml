[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "glossogen"
version = "0.1.2"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.120.2",
    "pydantic>=2.13.4",
    "aiofiles>=24.0.0",
    "orjson>=3.11.9",
    "jinja2>=3.1.0",
    "tenacity>=9.0.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.30.0",
    "mcp>=1.28.1",
    "pydantic-ai>=2.23.0,<3.0.0",
    "openai>=2.29.0",
    "httpx>=0.28.1",
    "huggingface_hub>=1.26.0",
    "weasyprint>=62.0",
    "markdown>=3.10.3",
    "python-dotenv>=1.2.2",
    "cachetools>=7.1.7",
    "rapidfuzz>=3.10.0",
    "psycopg[binary]>=3.3.4",
    "psycopg-pool>=3.2.0",
    "alembic>=1.18.5",
    "svix>=1.99.1",
    "clerk-backend-api>=3.0.0",
    "langfuse>=4.14.2",
]

[project.optional-dependencies]
# ML backend for the `perplexity` and English n-gram surprisal metrics only.
# Multi-gigabyte; deliberately excluded from the server image, which never
# executes these metrics. Absent the extra, those metrics log a skip and
# return no Measurement — see evaluation/metric_core/optional_ml_backend.py.
metrics-ml = [
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "minicons>=0.3.39",
    "datasets>=5.0.1",
]
# Inspect-AI harness for the veyru judge-accuracy evaluation
# (scenarios/veyru/evals/judge_accuracy_eval.py). Not needed to run
# simulations or the server.
evals = [
    "inspect-ai>=0.3.252",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort==5.13.2",
    "pyright>=1.1.411",
    "ruff>=0.16.1",
    "vulture>=2.14",
    "pytest>=9.1.1",
    "types-aiofiles>=25.1.0.20260518",
    "types-Markdown>=3.7.0.20250322",
    "types-cachetools>=7.0.0.20260713",
    "modal>=1.5.3",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.setuptools.packages.find]
where = ["src"]

# Prompt templates, knob defaults, probe question banks, and judge golden
# labels are loaded at runtime and must ship inside the installed package.
# Without this, only .py files are packaged: a source checkout and the Docker
# image still work (both install the project from source), but installing
# glossogen as a dependency yields a package that cannot render any prompt.
[tool.setuptools.package-data]
glossogen = [
    "**/*.jinja",
    "**/*.json",
    "**/*.tsv",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "ARG"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
extraPaths = ["src", "."]
ignore = ["vulture_whitelist.py", "runs", "modal", "scripts"]

[tool.vulture]
min_confidence = 80
