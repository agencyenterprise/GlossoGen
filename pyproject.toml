[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "glossogen"
version = "0.27.7"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.6.0",
    "pydantic>=2.14.3",
    "aiofiles>=24.0.0",
    "orjson>=3.13.0",
    "jinja2>=3.1.0",
    "tenacity>=9.0.0",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "mcp>=2.3.0",
    "pydantic-ai[groq,mistral,openrouter,xai]>=2.66.0,<3.0.0",
    "openai>=3.46.0",
    "httpx>=0.28.1",
    "huggingface_hub>=2.4.0",
    "weasyprint>=70.0",
    "markdown>=3.11.3",
    "python-dotenv>=1.2.4",
    "cachetools>=7.3.0",
    "rapidfuzz>=3.14.6",
    "psycopg[binary]>=3.3.8",
    "psycopg-pool>=3.3.3",
    "alembic>=1.20.1",
    "langfuse>=5.2.0",
    "genai-prices>=0.2.1",
]

[project.scripts]
# The commands the docs spell as `glossogen ...`. Without this they only work
# as `python -m glossogen`, which an installed dependency's users would have to
# discover for themselves.
glossogen = "glossogen.cli:main"

[project.optional-dependencies]
# ML backend for the `perplexity` and English n-gram surprisal metrics only.
# Multi-gigabyte; deliberately excluded from the server image, which never
# executes these metrics. Absent the extra, asking for one of those metrics is an
# error rather than a skip: it raises `MetricsMlExtraMissing` and evaluation exits
# non-zero, because a missing measurement reads as nothing to measure. See
# evaluation/metric_core/optional_ml_backend.py.
metrics-ml = [
    "torch>=2.15.0",
    "transformers>=5.22.1",
    "minicons>=0.3.39",
    "datasets>=5.0.1",
]
# Inspect-AI harness for the veyru judge-accuracy evaluation
# (scenarios/veyru/evals/judge_accuracy_eval.py). Not needed to run
# simulations or the server.
evals = [
    "inspect-ai>=0.3.287",
]
# `glossogen.testing`, for testing a scenario or metric that ships in its own
# package. pytest is in that API rather than only in its tests: `run_simulation`
# takes a `pytest.MonkeyPatch`, because controlling the clock is what makes a
# scenario test deterministic instead of a race against it.
#
# The floors are the oldest versions the harness is known to work against, not
# the ones this repository pins for its own suite. A consumer's test suite has
# its own reasons for the version it is on, and an extra that demands the newest
# makes them somebody else's problem: `MonkeyPatch` has been public API since
# pytest 6.2, and `asyncio_mode` since pytest-asyncio 0.17.
testing = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "isort==9.0.2",
    "pyright>=1.1.414",
    "ruff>=0.17.4",
    "vulture>=2.14",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "types-aiofiles>=25.1.0.20260518",
    "types-Markdown>=3.7.0.20250322",
    "types-cachetools>=7.0.0.20260713",
    "modal>=1.6.3",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "import-linter==2.11",
]

# The example notebooks under notebooks/, and what runs them in CI. A separate group
# rather than part of `dev` because jupyter, pandas and matplotlib are a few hundred
# megabytes, and an install that only runs the suite or the server does not execute a
# notebook. `make install-notebooks` adds it.
notebooks = [
    "jupyter>=1.1.1",
    "pandas>=3.1.1",
    "matplotlib>=3.11.2",
    "nbmake>=1.5.4",
]

# The documentation site. `mike` versions it, so a reader who pinned an older
# release reads the contract they are on rather than the newest one. A separate group
# for the same reason as `notebooks`, and added by `make install-docs`.
#
# Capped below MkDocs 2.0, which removes the plugin system. Everything this site is
# built out of is a plugin or a hook: `scripts/docs_hooks.py` rewrites the links that
# would 404, `mike` provides the versioning, and search is a plugin too. The cap is
# stated here rather than inherited from mkdocs-material's own `mkdocs<2`, so the
# reason survives a change on their side.
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.8.0,<10",
    "mike>=2.1.3",
    # Renders and executes the notebooks into the site. Execution, not just
    # rendering: the repo commits them output-free, so an unexecuted render would
    # publish empty cells. They script their models, so this needs no key.
    "mkdocs-jupyter>=0.27.0",
]

[tool.uv]
# Scoped to 3.14 because torch publishes no 3.15 wheels yet. Without the bound,
# any dependency that forks the resolution at 3.15 makes `uv lock` fail. Drop
# it once torch ships 3.15 wheels.
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64' and python_full_version < '3.15'",
    "sys_platform == 'linux' and platform_machine == 'x86_64' and python_full_version < '3.15'",
]

[tool.setuptools.packages.find]
where = ["src"]

# Prompt templates, knob defaults, probe question banks, and judge golden
# labels are loaded at runtime and must ship inside the installed package.
# Without this, only .py files are packaged: a source checkout and the Docker
# image still work (both install the project from source), but installing
# glossogen as a dependency yields a package that cannot render any prompt.
[tool.setuptools.package-data]
glossogen = [
    "**/*.jinja",
    "**/*.json",
    "**/*.tsv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The runtime is async throughout, so bare `async def` tests just work.
asyncio_mode = "auto"
# pytest-xdist registers this itself, but only when it is loaded. Declaring it
# here keeps a serial run (`-p no:xdist`) from warning about an unknown mark.
markers = [
    "xdist_group: run these tests on the same worker, so they can share a fixture",
    "metrics_ml: needs the metrics-ml extra; skipped unless --metrics-ml is passed",
]

[tool.coverage.run]
source = ["src/glossogen"]
branch = true
# The PR comment action reads paths out of the .coverage file and matches them
# against the diff. Absolute paths carry the runner's checkout directory and
# match nothing.
relative_files = true
# Alembic revisions only execute against a live database, so every one of them
# would sit at 0% forever and say nothing about the code under test.
omit = ["src/glossogen/db/migrations/*"]

[tool.coverage.report]
show_missing = true
# Bodies that exist to be overridden, not executed. `...` is the whole body of
# every abstract method on the scenario and metric contracts, so counting them
# as uncovered would report the ABCs as untested no matter what runs.
exclude_also = [
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.$",
]

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "ARG"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
extraPaths = ["src", "."]
# build/ and dist/ hold copies of src/ produced by `uv build`. They are
# gitignored, but pyright would otherwise type-check the stale duplicates
# and report errors against code that no longer exists.
ignore = ["vulture_whitelist.py", "runs", "modal", "scripts", "build", "dist"]

[tool.vulture]
min_confidence = 80

[tool.importlinter]
root_package = "glossogen"
include_external_packages = true

# Package boundaries. Architecture.md ("Package layers") describes the layers. An
# exception goes in `ignore_imports` with a comment saying why it is allowed and
# which step removes it. linter/check_package_cycles.py covers the cycles these
# contracts do not.

[[tool.importlinter.contracts]]
name = "A. The runner does not know about the web"
type = "forbidden"
source_modules = [
    "glossogen.runtime",
    "glossogen.runners",
    "glossogen.engine",
    "glossogen.llm",
    "glossogen.models",
]
forbidden_modules = [
    "glossogen.server",
    "glossogen.db",
    "glossogen.cli",
]
ignore_imports = [
    # The runner writes run status to Postgres. Whether it keeps doing that is
    # decided in a later architecture step.
    "glossogen.runtime.autonomous_supervisor -> glossogen.db.run_registry",
]

[[tool.importlinter.contracts]]
name = "B. Nothing imports the server"
type = "forbidden"
source_modules = [
    "glossogen.__main__",
    "glossogen.atif_export",
    "glossogen.cli",
    "glossogen.dashboards",
    "glossogen.db",
    "glossogen.dotenv_loader",
    "glossogen.engine",
    "glossogen.evaluation",
    "glossogen.frontend_container",
    "glossogen.knob_filter",
    "glossogen.label_descriptions",
    "glossogen.llm",
    "glossogen.mcp_tool_rejection",
    "glossogen.model_catalog",
    "glossogen.models",
    "glossogen.oauth_client",
    "glossogen.plugin_entry_points",
    "glossogen.primary_channel_resolution",
    "glossogen.prod_sync",
